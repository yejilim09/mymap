<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서관 & 서점 찾기 서비스</title>

    <style>
        /* 전체 페이지 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        /* 레이아웃: 왼쪽 사이드바 + 오른쪽 지도 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 및 목록 영역 */
        .sidebar {
            width: 360px;
            flex-shrink: 0;
            padding: 24px;
            overflow-y: auto;
            background-color: white;
            border-right: 1px solid #dddddd;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .description {
            color: #777777;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 탭 버튼 스타일 */
        .tab-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #f5f5f5;
            font-size: 14px;
            font-weight: bold;
            color: #555555;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-button.active {
            background-color: #fee500;
            border-color: #fee500;
            color: #000000;
        }

        /* 검색 폼 및 버튼 */
        .search-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        #searchInput {
            width: 0;
            min-width: 0;
            flex: 1;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        #searchButton {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #fee500;
            font-weight: bold;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background-color: white;
            font-weight: bold;
        }

        /* 상태 메시지 */
        #status {
            margin: 18px 0;
            color: #555555;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .result-item {
            padding: 16px 4px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #fffbea;
        }

        .place-name {
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 6px;
            color: #666666;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            color: #888888;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2366cc;
            font-size: 13px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background-color: #eeeeee;
        }
