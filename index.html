<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소 검색 서비스</title>

    <style>
        /* 전체 페이지의 기본 스타일 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        /* 화면을 왼쪽과 오른쪽으로 분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 380px;
            min-width: 320px;
            padding: 24px;
            background-color: #ffffff;
            border-right: 1px solid #dddddd;
            overflow-y: auto;
        }

        .sidebar h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin-bottom: 24px;
            color: #777777;
            font-size: 14px;
        }

        /* 검색창과 버튼 */
        .search-form {
            display: flex;
            gap: 8px;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #fee500;
            color: #191919;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #f2d900;
        }

        /* 현재 위치 버튼 */
        #locationButton {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background-color: #ffffff;
            cursor: pointer;
        }

        /* 상태 안내 문구 */
        #status {
            margin: 16px 0;
            color: #666666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .result-item {
            padding: 16px 4px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #fffbea;
        }

        .place-name {
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 6px;
            color: #666666;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            color: #888888;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2366cc;
            font-size: 12px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background-color: #eeeeee;
        }

        /* 화면이 좁을 때의 레이아웃 */
        @media (max-width: 600px) {
            .sidebar {
                width: 42%;
                min-width: 0;
                padding: 12px;
            }

            .sidebar h1 {
                font-size: 19px;
            }

            .search-form {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }

            .result-item {
                padding: 12px 2px;
            }
        }
    </style>

    <!-- 카카오맵 JavaScript SDK를 불러옴 -->
    <!-- services 라이브러리를 사용해야 장소 키워드 검색이 가능함 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d51eefd8d8257758999777f7a5e5e4e5&libraries=services&autoload=false">
    </script>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색창과 검색 결과 -->
        <aside class="sidebar">
            <h1>장소 검색</h1>
            <p class="description">원하는 장소를 검색해 보세요.</p>

            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="예: 강남역, 카페, 도서관"
                    aria-label="검색할 장소"
                >
                <button type="submit" id="searchButton">검색</button>
            </form>

            <button type="button" id="locationButton">
                현재 위치로 이동
            </button>

            <p id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <ul id="resultList"></ul>
        </aside>

        <!-- 오른쪽: 카카오맵 -->
        <main id="map" aria-label="장소 검색 지도"></main>
    </div>

    <script>
        // 지도와 검색 기능에 필요한 변수를 선언
        let map = null;
        let placesService = null;
        let currentMarker = null;
        let infoWindow = null;

        // HTML 요소를 가져옴
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const locationButton = document.getElementById("locationButton");
        const resultList = document.getElementById("resultList");
        const statusText = document.getElementById("status");

        // 기본 위치는 서울시청으로 설정
        // 위치 권한을 거부하거나 위치 정보를 가져오지 못할 때 사용
        const defaultPosition = new kakao.maps.LatLng(
            37.5665,
            126.9780
        );

        // 카카오맵 SDK가 준비된 후에 지도와 검색 기능을 초기화
        kakao.maps.load(function () {
            // 지도를 생성할 영역과 초기 설정을 지정
            const mapOptions = {
                center: defaultPosition,
                level: 5
            };

            // 지도 객체 생성
            map = new kakao.maps.Map(
                document.getElementById("map"),
                mapOptions
            );

            // 장소 검색 서비스 생성
            placesService = new kakao.maps.services.Places();

            // 장소 정보를 표시할 인포윈도우 생성
            infoWindow = new kakao.maps.InfoWindow({
                removable: true
            });

            // 지도 객체가 생성된 후 현재 위치를 요청
            getCurrentLocation();

            statusText.textContent =
                "장소를 검색하거나 현재 위치를 확인할 수 있습니다.";
        });

        // 현재 위치 정보를 요청
        function getCurrentLocation() {
            // 브라우저가 위치 정보를 지원하는지 확인
            if (!navigator.geolocation) {
                statusText.textContent =
                    "이 브라우저에서는 위치 정보를 사용할 수 없습니다.";
                return;
            }

            statusText.textContent =
                "현재 위치를 확인하고 있습니다.";

            // 브라우저에 위치 권한을 요청
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도를 가져옴
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    const currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 현재 위치를 지도 중심으로 설정
                    map.setCenter(currentPosition);

                    // 현재 위치에 마커를 표시
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition
                    });

                    statusText.textContent =
                        "현재 위치를 지도에 표시했습니다.";
                },
                function (error) {
                    // 위치 정보를 가져오지 못한 이유를 안내
                    if (error.code === error.PERMISSION_DENIED) {
                        statusText.textContent =
                            "위치 권한이 거부되었습니다. 서울시청을 기준으로 지도를 표시합니다.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        statusText.textContent =
                            "현재 위치를 확인할 수 없습니다. 서울시청을 기준으로 표시합니다.";
                    } else if (error.code === error.TIMEOUT) {
                        statusText.textContent =
                            "위치 확인 시간이 초과되었습니다. 서울시청을 기준으로 표시합니다.";
                    } else {
                        statusText.textContent =
                            "위치 정보를 가져오지 못했습니다.";
                    }
                },
                {
                    // 위치 확인에 사용할 옵션
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 현재 위치 버튼을 누르면 위치 정보를 다시 요청
        locationButton.addEventListener("click", function () {
            getCurrentLocation();
        });

        // 검색 폼이 제출되면 키워드 검색을 실행
        searchForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const keyword = searchInput.value.trim();

            if (!keyword) {
                statusText.textContent =
                    "검색할 장소 이름을 입력해 주세요.";
                searchInput.focus();
                return;
            }

            // SDK와 검색 서비스가 준비되었는지 확인
            if (!map || !placesService) {
                statusText.textContent =
                    "지도를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.";
                return;
            }

            searchPlaces(keyword);
        });

        // 키워드로 장소를 검색
        function searchPlaces(keyword) {
            statusText.textContent =
                "'" + keyword + "' 검색 중입니다.";

            resultList.replaceChildren();

            placesService.keywordSearch(
                keyword,
                function (data, resultStatus) {
                    // 검색 결과가 없는 경우
                    if (
                        resultStatus ===
                        kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusText.textContent =
                            "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
                        return;
                    }

                    // 검색 요청이 실패한 경우
                    if (
                        resultStatus !==
                        kakao.maps.services.Status.OK
                    ) {
                        statusText.textContent =
                            "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";
                        return;
                    }

                    statusText.textContent =
                        "검색 결과 " + data.length + "개";

                    // 검색 결과를 목록에 표시
                    data.forEach(function (place) {
                        const listItem = document.createElement("li");
                        listItem.className = "result-item";

                        const name = document.createElement("div");
                        name.className = "place-name";
                        name.textContent = place.place_name;

                        const address = document.createElement("div");
                        address.className = "place-address";
                        address.textContent =
                            place.road_address_name ||
                            place.address_name ||
                            "주소 정보 없음";

                        const phone = document.createElement("div");
                        phone.className = "place-phone";
                        phone.textContent =
                            place.phone || "전화번호 정보 없음";

                        listItem.appendChild(name);
                        listItem.appendChild(address);
                        listItem.appendChild(phone);

                        // 카카오맵 장소 상세 페이지 링크가 있으면 추가
                        if (place.place_url) {
                            const link = document.createElement("a");

                            link.className = "place-link";
                            link.href = place.place_url;
                            link.target = "_blank";
                            link.rel = "noopener noreferrer";
                            link.textContent = "카카오맵에서 보기";

                            // 링크 클릭 시 목록 항목의 지도 이동 이벤트가 실행되지 않게 함
                            link.addEventListener("click", function (event) {
                                event.stopPropagation();
                            });

                            listItem.appendChild(link);
                        }

                        // 검색 결과를 클릭하면 지도 중심을 해당 장소로 이동
                        listItem.addEventListener("click", function () {
                            showPlaceOnMap(place);
                        });

                        resultList.appendChild(listItem);
                    });

                    // 첫 번째 검색 결과를 지도에 표시
                    if (data.length > 0) {
                        showPlaceOnMap(data[0]);
                    }
                },
                {
                    // 한 페이지에 표시할 검색 결과 수
                    size: 15
                }
            );
        }

        // 선택한 장소로 지도를 이동하고 정보를 표시
        function showPlaceOnMap(place) {
            const placePosition = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            // 선택한 장소를 지도 중심으로 설정
            map.setCenter(placePosition);

            // 선택한 장소에 맞게 마커를 표시
            if (currentMarker) {
                currentMarker.setMap(null);
            }

            currentMarker = new kakao.maps.Marker({
                map: map,
                position: placePosition
            });

            // 장소 이름을 인포윈도우에 표시
            const content = document.createElement("div");
            content.style.padding = "8px 12px";
            content.style.fontSize = "13px";
            content.textContent = place.place_name;

            infoWindow.setContent(content);
            infoWindow.open(map, currentMarker);
        }
    </script>
</body>
</html>
